[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "determdinistic"
version = "0.1.0"
description = "Deterministic mirrors for declared Markdown tables and fences"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
detmd = "detmd:main"

[tool.setuptools]
py-modules = ["detmd"]
